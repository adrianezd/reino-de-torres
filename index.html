<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Reino de Torres — tower defense de fusión gratis</title>
<meta name="description" content="Tower defense de fusión gratis para móvil: invoca tropas con nombre propio, fusiónalas, recolócalas y defiende tu reino. Campaña de 15 fases, duelo 1 contra 1 y modo cooperativo contra la máquina.">
<meta name="theme-color" content="#1b2a6b">
<meta property="og:title" content="Reino de Torres">
<meta property="og:description" content="Invoca tropas, fusiónalas y defiende tu reino. Campaña, duelo 1 contra 1 y cooperativo.">
<meta property="og:image" content="og-image.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=33">
</head>
<body>
  <div id="menu" class="menu"></div>
  <nav id="navbar" class="navbar" aria-label="Secciones">
    <button data-tab="shop"><i><x-ico style="background-image:url(assets/chests/oro-cofre.webp)"></x-ico></i><span>Tienda</span></button>
    <button data-tab="collection"><i><x-ico style="background-image:url(assets/units/lyra.webp)"></x-ico></i><span>Mazo</span></button>
    <button data-tab="home"><i><x-ico style="background-image:url(assets/icons/espadas.webp)"></x-ico></i><span>Jugar</span></button>
    <button data-tab="teams" class="locked"><i><x-ico style="background-image:url(assets/icons/escudo.webp)"></x-ico></i><span>Equipos</span><b><x-ico style="background-image:url(assets/icons/candado.webp)"></x-ico></b></button>
  </nav>

  <div id="battleScreen" class="battle" hidden>
    <div class="b-top">
      <button class="b-btn quit" id="bQuit" aria-label="Pausa y salir">✕</button>
      <div class="lives" id="bLivesBox"><span id="bLives"></span></div>
      <div class="b-wave"><b id="bWave">Oleada 1</b><span id="bEvent" class="b-event" hidden></span></div>
      <div class="mana" aria-label="Maná"><img src="assets/ui/contador-mana.webp" alt=""><b id="bMana">100</b></div>
      <button class="b-btn speed" id="bSpeed" aria-label="Velocidad">x1</button>
    </div>
    <div id="arena" class="arena">
      <canvas id="cv"></canvas>
      <div id="banner" class="banner"></div>
      <div id="waveInfo" class="wave-info" hidden></div>
      <div id="unitInfo" class="unit-info" hidden></div>
      <div id="coach" class="coach" hidden></div>
    </div>
    <div class="b-bottom">
      <div class="b-actions">
        <button id="cmdBtn" class="cmd-btn" aria-label="Habilidad del comandante"><span id="cmdIco"></span></button>
        <button id="summonBtn" class="summon-btn">Invocar<small id="summonCost">10</small></button>
      </div>
      <div id="deckBar" class="deck-bar"></div>
    </div>
  </div>

  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast"></div>

  <script src="js/data.js?v=21"></script>
  <script src="js/art.js?v=21"></script>
  <script src="js/meta.js?v=19"></script>
  <script src="js/board.js?v=22"></script>
  <script src="js/battle.js?v=22"></script>
  <script src="js/ui.js?v=33"></script>
</body>
</html>
